plugins {
	id "build-tools"
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

apply from: "dependencies.gradle"

loom {
	splitEnvironmentSourceSets()
	
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName.set("${mod_id}.refmap.json")
	}
	
	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	
	runs {
		client {
			client()
			
			runDirectory = file("runs/client")
			
			if(System.getenv("MC_USERNAME") && System.getenv("MC_UUID"))
			{
				programArguments.add("--username")
				programArguments.add(System.getenv("MC_USERNAME"))
				programArguments.add("--uuid")
				programArguments.add(System.getenv("MC_UUID"))
			}
		}
		
		server {
			server()
			
			runDirectory = file("runs/server")
		}
	}
	
	runs.configureEach {
		systemProperties.put("mixin.debug.export", "true")
		systemProperties.put("mixin.debug.verbose", "true")
	}
}

// This is a little odd, but it is required so it includes the refmap file in the completed build
tasks.named("compileJava", JavaCompile) {
	source(project(":common").sourceSets.main.allJava)
	options.compilerArgs.add("-proc:only")
}